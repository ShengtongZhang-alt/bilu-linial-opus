related_formalizations:
  - id: "https://github.com/karlesmarin/godsil-gutman-lean/tree/73eb9c0c01c8317ad4bcd23e70d9e289e61753c0"
    relationship: independent
    note: >-
      Lean 4 / Mathlib formalization (C. Marín, 2026) of the Godsil–Gutman
      identity (the average characteristic polynomial of a uniformly random
      signing is the matching polynomial) and of the Bilu–Linial 2-lift
      characteristic polynomial factorization. No code is shared, and the
      present development uses neither matching polynomials nor 2-lifts. A
      brief web search found no earlier Lean formalization of bounds on
      Bilu–Linial signings or of the Gaussian correlation inequality; novelty
      beyond that search is unknown.

status:
  scope: >-
    Fully formalized: (1) BiluLinial.near_ramanujan_signing, the upper bound
    of Theorem 1 of docs/second_order_bilu_linial_tight.tex, stated with d in
    place of q = d − 1 and with a strict inequality; both changes give an
    equivalent statement, as proved in BiluLinial/SanityD.lean; (2)
    BiluLinial.explicit_excess, the Section 6 lower bound of
    docs/second_order_bilu_linial.tex with the explicit constant 1/25. Also
    proved, but outside the compared selection: the draft form γ_d ≥ R_q of
    Section 6; Theorem B of docs/COUNTEREXAMPLE_ALL_DEGREES.md (every degree
    d ≥ 3); sanity lemmas for the definitions and statements
    (BiluLinial/Sanity*.lean); and the analytic tools listed in the
    description. Not formalized: the lower bound of Theorem 1 of the tight
    draft (Sherrington–Kirkpatrick constant, random regular graphs) and
    Section 7 of the second-order draft. The superseded upper bounds of
    docs/asymptotic_bilu_linial.tex and Theorem 1.1 of
    docs/second_order_bilu_linial.tex were formalized and then deleted (they
    are not included); near_ramanujan_signing implies them, and
    BiluLinial.secondOrderStatement_of_nearRamanujan proves the implication to
    the latter.
  sorry_count: 0
  sorry_in_definitions: 0
  # Every axiom appearing in `#print axioms` for the main results (checked by
  # scripts/check-axioms.rb and by Comparator's `permitted_axioms`).
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "BiluLinial.near_ramanujan_signing"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "BiluLinial.explicit_excess"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    # Phase 0a (before the formalization): the source drafts.
    - method: other
      models: ["GPT 6 Astra (OpenAI)"]
      tool_setup: >-
        Not a Lean phase. GPT 6 Astra generated the three source drafts
        docs/asymptotic_bilu_linial.tex, docs/second_order_bilu_linial.tex and
        docs/second_order_bilu_linial_tight.tex, which list no author and have
        not been independently reviewed. Recorded here because the sources
        being formalized are AI-generated.
      cost:
        spend_usd: "not tracked"
        hardware: "API-hosted model."
    # Phase 0b: the all-degree counterexample note and the supervising session.
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Cursor"
      tool_setup: >-
        Not a Lean phase. In a Claude Opus 5.5 chat session in Cursor, the
        extension of Xu's counterexample to every degree d ≥ 3 was developed
        and checked with sympy and numerically. A second Claude Opus 5.5
        session wrote it up as docs/COUNTEREXAMPLE_ALL_DEGREES.md. That session
        also set up this repository (toolchain, scaffold, the task briefs in
        AGENTS.md and the reviewer notes docs/SECOND_ORDER_NOTES.md), launched
        the phase 1 coordinator, relayed the maintainer's instructions, and
        occasionally suggested a proof route (one is recorded in
        docs/BLUEPRINT.md as a "supervisor hint").
      cost:
        spend_usd: "not tracked"
        hardware: "Local Apple Silicon Mac; API-hosted model."
      prompting_notes: >-
        Directed interactively by the maintainer, who supplied the drafts and
        asked for them to be formalized as fast as possible.
    # Phase 1: the Lean development (statements, blueprint, all proofs).
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Cursor (cursor-agent CLI)"
      tool_setup: >-
        AI-generated. One coordinator agent running Claude Opus 5.5, launched
        with the cursor-agent CLI from the phase 0b session, wrote the
        Challenge statements, the sanity lemmas, FORMALIZATION.md and the lemma
        DAGs of docs/BLUEPRINT.md (with audit notes in docs/tight/). It kept up
        to ten subagents of the same model working in parallel, 120 subagent
        tasks in all, each proving one node or a small cluster of nodes. A node
        went to a prover only after its statement had been checked: a proof
        sketch, a parent proof from the node's statement, small cases, and
        often numerical checks (scripts/). Each node was checked with Lean and
        `#print axioms`. Only Lean, Mathlib and their standard tactics were
        used; no external proof search.
      cost:
        wall_time: >-
          About 34 hours of elapsed time, 2026-09-29 19:41 to 2026-10-01 05:47
          (UTC−7), including idle periods. Theorem B took about one hour,
          explicit_excess about 40 minutes after its draft was added, and
          near_ramanujan_signing about 8 hours 45 minutes, from 2026-09-30
          21:02 to 2026-10-01 05:47.
        spend_usd: "not tracked"
        hardware: "Local Apple Silicon Mac (16 cores, 64 GiB) for Lean builds; API-hosted models."
      prompting_notes: >-
        The maintainer supplied the source drafts and asked for them to be
        formalized as fast as possible. He chose the results to target and
        fixed their final form, for example that the Challenge holds exactly
        two theorems, stated in terms of d only. The rules given to the agents
        are in AGENTS.md and .cursor/rules/formalization-workflow.mdc: never
        weaken a statement to route around a gap, record every gap in
        docs/BLUEPRINT.md, and use no axioms.
    # Phase 2: the Palomar submission surface (no proof content).
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Cursor"
      tool_setup: >-
        Ported all 225 Lean files to the module system (`module`,
        `public import`, `@[expose] public section`), added
        `set_option maxHeartbeats 400000 in` to one lemma that the port pushed
        just over the default budget, and wrote this file, comparator.json's
        final form, README.md, README_lean.md, VERIFICATION.md, the scripts/ checks and the CI
        workflow. Verified with lake build, scripts/check_statements.sh,
        `#print axioms` and the toolchain's `lake comparator` with the NanoDa
        and con-ron kernels. No proof content was changed.
      cost:
        wall_time: "About two hours (2026-10-01)."
        spend_usd: "not tracked"
        hardware: "Local Apple Silicon Mac; API-hosted model."
      prompting_notes: >-
        Directed by the maintainer: prepare the repository for Palomar
        submission in the same way as his earlier submissions.
  spend_usd: "not tracked"
  notes: >-
    Human-directed, agent-executed workflow. Shengtong Zhang is the responsible
    maintainer of this repository. GPT 6 Astra generated the source drafts
    (phase 0a). Claude Opus 5.5 developed and wrote up the all-degree
    counterexample note and supervised the run (phase 0b), produced all of the
    Lean code and documentation (phase 1), and did the submission packaging
    (phase 2). The maintainer reviewed Challenge.lean (the definitions and
    the compared statements); no human has reviewed the other formalization
    files or the drafts. Correctness of the proofs rests on the Lean kernel
    and the independent kernels run by Comparator; whether the statements in
    Challenge.lean mean what the drafts claim is also addressed by
    FORMALIZATION.md and the sanity lemmas.

fidelity:
  divergences: >-
    Statements: near_ramanujan_signing uses d^(−2/17) and a strict inequality
    where the draft has q^(−2/17) and ≤ (q = d − 1); because C is existential
    the four combinations are equivalent, and the equivalences are proved
    (BiluLinial.nearRamanujanStatement_iff_le,
    BiluLinial.nearRamanujanStatement_iff_subOne). The statement is the
    per-graph form of γ_(q+1) ≤ R, since a graph has finitely many signings;
    γ_d itself is not defined. explicit_excess replaces the draft's
    (1 + O(1/q))q^(−11/2) by the explicit q^(−11/2)/25 for every q ≥ 3; this
    follows from, and is weaker than, the draft's γ_d ≥ R_q, which is also
    proved. Proof of the upper bound: (a) the draft's Gaussian-correlation
    step (incident-row gain GR1 and the row comparison CR3) is replaced by
    the estimates DR1 and CR3′, which avoid the Gaussian correlation
    inequality; (b) the deletion lemma's ODE lift became a Knaster–Tarski
    fixed point; (c) the Brascamp–Lieb step with a variable Hessian is proved
    from the midpoint Prékopa–Leindler inequality; (d) local gaps were
    repaired: implicit hypotheses of the capped source family, an exponent
    condition in (E4), a missing error term in (D10), an absolute error in the
    whitening step where a relative one is needed, moment requirements in the
    remainder transfer, and the law at zero sources (fixed by normalized
    precisions). None required a change of statement. Details are in
    FORMALIZATION.md ("Known discrepancies") and docs/BLUEPRINT.md.
    Conventions: Mathlib's SimpleGraph (simple, loopless), signings as maps
    from the edge set to ℤˣ, the norm as the operator norm of
    Matrix.toEuclideanCLM, which is 0 on the empty matrix as the drafts
    stipulate.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 audit agents (Anthropic)"
  notes: >-
    Separate audit agents checked the Part D draft section by section before
    its DAG was built (docs/tight/AUDIT_*.md, CHECK_*.md); their findings are
    the gaps listed under fidelity. A third compared theorem,
    opNorm_eq_iSup_abs_eigenvalues₀, states that opNorm equals the largest
    absolute value of an eigenvalue for symmetric matrices (Mathlib's
    Matrix.IsHermitian.eigenvalues₀), so both statements can be read in
    eigenvalue form. The definitions and statements are tied to
    their intended meaning by fully proved sanity lemmas
    (BiluLinial/Sanity.lean, SanityC.lean, SanityD.lean): the norm is the ℓ²
    operator norm and the largest absolute eigenvalue, A_σ is symmetric with
    ±1 exactly on edges, the statements are equivalent to the drafts' forms,
    they are not vacuous, and the correction term in near_ramanujan_signing is
    necessary. FORMALIZATION.md gives the source-to-Lean correspondence. Every
    proof is machine-checked by Lean, and `lake comparator` (Lean kernel,
    NanoDa, con-ron) accepts Solution against Challenge. The maintainer has
    read Challenge.lean and is convinced that it formalizes the results
    correctly; this is a check by the responsible maintainer, not an
    independent review. He has not reviewed the other formalization files or
    the source drafts, and no independent human review has been performed.

alignment:
  namespace: "BiluLinial"
  statements:
    - source: "second_order_bilu_linial_tight.tex, Theorem 1 (thm:bounds), right-hand inequality"
      lean: "BiluLinial.near_ramanujan_signing"
      module: "Solution"
      status: proved
      note: >-
        ∃ C d₀, ∀ d ≥ d₀, ∀ finite simple graph G with every degree ≤ d,
