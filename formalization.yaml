# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (mathlib-initiative format) with the Palomar registry additions
# (responsible maintainers, classification, sources with relationships).
version: "v0.4"

project:
  name: "Near-Ramanujan signings of bounded-degree graphs and an explicit excess over 2√(d−1), in Lean"
  description: >-
    A complete Lean 4 / Mathlib formalization of two bounds on how small the
    signed adjacency norm of a graph can be made. A signing of a finite simple
    graph G assigns a sign ±1 to every edge; A_σ is the signed adjacency matrix
    (σ(uv) at each edge, 0 elsewhere) and ‖A_σ‖ its Euclidean operator norm,
    the largest absolute value of an eigenvalue. Bilu and Linial (2006)
    conjectured that every d-regular graph has a signing with
    ‖A_σ‖ ≤ 2√(d−1). Marcus, Spielman and Srivastava proved the one-sided bound
    λ_max(A_σ) ≤ 2√(d−1); for the two-sided norm Ravichandran and Srivastava
    proved 2√(2(d−1)), recent preprints improve the coefficient (Lin–Zhou) and
    give a polynomial-time algorithm (Jadbabaie–Saberi–Sra), and a recent
    preprint of Xu disproves the conjecture for d = 3.


    The first compared theorem (BiluLinial.near_ramanujan_signing) says that
    the conjecture holds up to a second-order term: there are absolute
    constants C and d₀ such that for every d ≥ d₀, every finite simple graph of
    maximum degree at most d has a signing with
    ‖A_σ‖ < √(4(d−1) + C d^(−2/17)), that is 2√(d−1) + O(d^(−1/2−2/17)),
    uniformly in the number of vertices. This is the upper bound of Theorem 1
    of the unreviewed research draft "Bounds for the Bilu–Linial signing
    constant". The second (BiluLinial.explicit_excess) says that the
    correction term cannot be removed: for every d ≥ 4 there is a finite,
    connected, d-regular graph all of whose signings have
    ‖A_σ‖ ≥ 2√(d−1) + (d−1)^(−11/2)/25. It is an explicit-constant form of
    Section 6 of the unreviewed draft "Second-order bounds for graph
    signings"; the constant 1/25 is ours. Together, for large d, the optimal
    value min over signings of ‖A_σ‖, maximized over graphs of maximum degree
    at most d, lies between 2√(d−1) + (d−1)^(−11/2)/25 and
    2√(d−1) + O(d^(−1/2−2/17)). Library theorems outside the compared
    selection extend Xu's counterexample to every degree d ≥ 3 and prove the
    draft's sharper form of the lower bound.


    The upper bound is proved by strong induction on vertex sets for a
    determinant-weighted law on signings. Its weight is
    1{P⁺ ≻ 0, P⁻ ≻ 0} (det P⁺ det P⁻)^p, where P^± = diag Z(y^±) ± A_σ/R are
    precision matrices driven by vertex sources y^±, R² = 4(d−1) + 4/p and
    p = ⌊c₀ d^(2/17)⌋. A positive total weight yields a signing with
    ‖A_σ‖ < R. The induction keeps the mean diagonal resolvents below a cap on
    a box of sources and rules out a first contact with the cap, using
    Schur-complement insertion identities, a deletion lemma, and Gaussian and
    Rademacher comparison estimates for the inserted rows. The analytic tools
    are proved in finite dimension in the repository: a midpoint
    Prékopa–Leindler inequality and Prékopa's theorem, covariance bounds for
    even log-concave perturbations of a Gaussian, a Brascamp–Lieb variance
    inequality for linear functions, Gaussian integration by parts and
    Rademacher-to-Gaussian comparisons. The draft's single use of the Gaussian
    correlation inequality (in E. Milman's monotonicity form) is replaced by a
    different estimate. The library nevertheless also proves Royen's
    monotonicity theorem for the standard Gaussian measure and two symmetric
    polyhedra, which gives the Gaussian correlation inequality in that case,
    and its extension to two centred ellipsoids; the final proof does not use
    these. Every unspecified constant of the draft became explicit or an
    existential at the right quantifier level, uniform in the graph. Several
    local gaps in the draft were repaired without changing the statement. The
    lower bound is a Schur-complement computation on an explicit graph built
    from triangle seeds, (d−1)-ary trees, iterated joins and a regular
    completion, followed by a direct check that a polynomial inequality holds
    at the explicit threshold.


    Both theorems are proved with no sorry and depend only on propext,
    Classical.choice and Quot.sound. The source drafts were generated by GPT 6
    Astra and have not been independently reviewed. The development, about
    74,000 lines of Lean, was written by Claude Opus 5.5 agents under human
    direction.
  authors:
    - "Shengtong Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Shengtong Zhang"

# `repository` is omitted: this repository is the substantive proof development,
# not a thin Comparator wrapper.

classification:
  arxiv: [math.CO, math.PR]
  msc2020: ["05C50", "05C22", "05C48", "15A42", "60E15"]

sources:
  - title: "Bounds for the Bilu–Linial signing constant"
    id: "docs/second_order_bilu_linial_tight.tex (this repository, at the submitted commit)"
    type: other
    location: "docs/second_order_bilu_linial_tight.tex"
    relationship: formalizes
    note: >-
      Unpublished, undated research draft generated by GPT 6 Astra (OpenAI),
      with no author listed and no independent review; supplied by the
      maintainer and included in the repository. Its Theorem 1 states
      2√q + 2q^(−5/2) − (32P*/√3 + o(1))q^(−3) ≤ γ_(q+1) ≤ √(4q + Cq^(−2/17)).
      BiluLinial.near_ramanujan_signing formalizes the right-hand inequality
      (proof in Section 1 of the draft). The left-hand inequality (Section 2,
      via the Sherrington–Kirkpatrick constant and random regular graphs) is
      not formalized. The formal proof follows Section 1 except for the
      deviations listed under fidelity and in FORMALIZATION.md, the main one
      being that the draft's Gaussian-correlation step (Lemma "Uniform
      incident-row gain") is replaced by a different estimate.
    license: unknown
    author_endorsement: n/a
  - title: "Second-order bounds for graph signings"
    id: "docs/second_order_bilu_linial.tex (this repository, at the submitted commit)"
    type: other
    location: "docs/second_order_bilu_linial.tex"
    relationship: adapts
    note: >-
      Unpublished research draft dated September 29, 2026, generated by GPT 6
      Astra (OpenAI), with no author listed and no independent review;
      supplied by the maintainer and included in the repository. Section 6
      constructs, for every q = d − 1 ≥ 3 and every threshold R < R_q, a
      connected d-regular graph (depending on R) all of whose signings have
      norm at least R, and concludes γ_d ≥ R_q by letting R increase to R_q.
      Here R_q = 2√q + (1 + O(1/q))q^(−11/2) is defined through a root of an
      explicit quartic.
      BiluLinial.explicit_excess restates this with the explicit lower bound
      2√q + q^(−11/2)/25 (our constant; numerically q^(11/2)(R_q − 2√q) rises
      from 0.048 at q = 3 to 1) and is proved by running the Section 6
      construction at an explicit threshold, so the root never appears. The
      draft's own form γ_d ≥ R_q is also proved
      (BiluLinial.SecondOrder.Explicit.explicit_excess_proof). The draft's
      upper bound 2√d + O(d^(1/6)) (Theorem 1.1) was formalized earlier in
      this repository and then deleted as superseded by
      near_ramanujan_signing; it is not included. Its Section 7 lower bound
      is not formalized.
    license: unknown
    author_endorsement: n/a
  - title: "The Bilu–Linial signing conjecture fails in every degree d ≥ 3"
    id: "docs/COUNTEREXAMPLE_ALL_DEGREES.md (this repository, at the submitted commit)"
    type: other
    location: "docs/COUNTEREXAMPLE_ALL_DEGREES.md"
    relationship: formalizes
    note: >-
      Unpublished note extending Xu's cubic counterexample to every degree
      d ≥ 3. The extension was developed in a Claude Opus 5.5 (Anthropic) chat
      session on 2026-09-29 and written up by a Claude Opus 5.5 session, with
      sympy and numerical checks (see the note's status paragraph). It is the
      source of the library theorem
      BiluLinial.bilu_linial_counterexample_proof (BiluLinial/Main.lean),
      which is fully proved but is not among the compared declarations. For
      d ≥ 4 that theorem also follows from explicit_excess; it is kept because
      it covers d = 3.
    author_endorsement: n/a
  - title: "Asymptotically optimal graph signings"
    id: "docs/asymptotic_bilu_linial.tex (this repository, at the submitted commit)"
    type: other
    location: "docs/asymptotic_bilu_linial.tex"
    relationship: background
    note: >-
      Earlier unpublished research draft dated September 29, 2026, generated
      by GPT 6 Astra (OpenAI), with no author listed, proposing the bounds (2 + o(1))√d and
      (2 + O(log log d / log d))√d for graphs of maximum degree at most d. Both
      were formalized earlier in this repository and deleted once
      near_ramanujan_signing, which implies them, was proved; they are not
      included. Its determinant-weight framework and the strong induction on
      vertex sets are the starting point of the drafts formalized here.
    license: unknown
    author_endorsement: n/a
  - title: "A 3-regular counterexample to the Bilu–Linial signing conjecture"
    authors: ["Zhiqiang Xu"]
    id: "arXiv:2609.15591"
    type: paper
    location: "https://arxiv.org/abs/2609.15591"
    relationship: background
    note: >-
      Preprint (September 2026; version 3 is included as
      docs/Xu_2609.15591v3.pdf, version 4 is current). Constructs a connected
      cubic graph every signing of which has norm greater than 2√2. The lower
      bound construction of explicit_excess develops Xu's triangle-and-tree
      obstruction, and the library theorem bilu_linial_counterexample_proof
      follows his proof step by step for every d ≥ 3.
    author_endorsement: not-contacted
  - title: "Lifts, discrepancy and nearly optimal spectral gap"
    authors: ["Yonatan Bilu", "Nathan Linial"]
    id: "doi:10.1007/s00493-006-0029-7"
    type: paper
    location: "https://doi.org/10.1007/s00493-006-0029-7"
    relationship: background
    note: >-
      Combinatorica 26 (2006), 495–519. Poses the signing conjecture
      ‖A_σ‖ ≤ 2√(d−1) for d-regular graphs and proves O(√(d log³ d)).
  - title: "Interlacing families I: Bipartite Ramanujan graphs of all degrees"
    authors: ["Adam W. Marcus", "Daniel A. Spielman", "Nikhil Srivastava"]
    id: "doi:10.4007/annals.2015.182.1.7"
    type: paper
    location: "https://doi.org/10.4007/annals.2015.182.1.7"
    relationship: background
    note: >-
      Ann. of Math. 182 (2015), 307–325. The one-sided bound
      λ_max(A_σ) ≤ 2√(d−1), hence the conjecture for bipartite graphs.
  - title: "Asymptotically optimal multi-paving"
    authors: ["Mohan Ravichandran", "Nikhil Srivastava"]
    id: "doi:10.1093/imrn/rnz111"
    type: paper
    location: "https://doi.org/10.1093/imrn/rnz111"
    relationship: background
    note: "Int. Math. Res. Not. IMRN 2021, no. 14, 10908–10940. The two-sided bound 2√(2(d−1))."
  - title: "Improved bounds for the Bilu–Linial conjecture via spectral recovery from mixed determinantal polynomials"
    authors: ["Fangfang Lin", "Hong Zhou"]
    id: "arXiv:2609.15715"
    type: paper
    location: "https://arxiv.org/abs/2609.15715"
    relationship: background
    note: "Preprint (September 2026). Improves the coefficient of the two-sided bound to (3 + √5)/2."
  - title: "Kadison–Singer partitions and Bilu–Linial graph signings in polynomial time"
    authors: ["Ali Jadbabaie", "Amin Saberi", "Suvrit Sra"]
    id: "arXiv:2609.23855"
    type: paper
    location: "https://arxiv.org/abs/2609.23855"
    relationship: background
    note: >-
      Preprint (September 2026). The drafts take their determinant weights and
      vertex insertion and deletion identities from its Section 6.
  - title: "On logarithmic concave measures and functions"
    authors: ["András Prékopa"]
    id: "Acta Sci. Math. (Szeged) 34 (1973), 335–343"
    type: paper
    relationship: background
    note: >-
      Prékopa's theorem, cited by the draft for the covariance bound of even
      log-concave densities. The repository proves the midpoint
      Prékopa–Leindler inequality and Prékopa's theorem on ℝ^n
      (BiluLinial/Tight/Gauss/PrekopaLeindler.lean) and derives the needed
      covariance bounds from them.
  - title: "On extensions of the Brunn–Minkowski and Prékopa–Leindler theorems, including inequalities for log concave functions, and with an application to the diffusion equation"
    authors: ["Herm Jan Brascamp", "Elliott H. Lieb"]
    id: "doi:10.1016/0022-1236(76)90004-5"
    type: paper
    location: "https://doi.org/10.1016/0022-1236(76)90004-5"
    relationship: background
    note: >-
      J. Funct. Anal. 22 (1976), 366–389. The Brascamp–Lieb variance
      inequality, which the draft uses for linear functions. The repository
