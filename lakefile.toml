name = "BiluLinial"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BiluLinial", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "BiluLinial"
globs = ["BiluLinial", "BiluLinial.+"]

# `Challenge` is the Mathlib-only statement module a reader audits.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# `Solution` restates the Challenge theorems with proofs (checked by the comparator,
# `comparator.json`).
[[lean_lib]]
name = "Solution"
roots = ["Solution"]
